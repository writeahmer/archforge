<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchForge Web Control Panel</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .badge { background: #0369a1; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
    .card h2 { font-size: 16px; margin-bottom: 14px; color: var(--primary); }
    
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    button {
      padding: 9px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #0f172a; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #dc2626; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .console-panel { background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: monospace; font-size: 13px; min-height: 220px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    .todo-list { list-style: none; }
    .todo-item { padding: 6px 0; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .todo-completed { color: var(--success); }
    .todo-in-progress { color: var(--primary); font-weight: bold; }
    .todo-pending { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ArchForge Web Interface <span class="badge">Fallback Mode</span></h1>
      <p class="subtitle">Autonomous Architectural Code Agent powered by DeepSeek API.</p>
    </header>

    <div class="grid">
      <!-- LLM Configuration -->
      <div class="card">
        <h2>DeepSeek Configuration</h2>
        <div class="form-group">
          <label for="apiKey">DeepSeek API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..." />
        </div>
        <div class="form-group">
          <label for="modelName">Model</label>
          <input type="text" id="modelName" value="deepseek-chat" />
        </div>
        <div class="form-group">
          <label for="baseUrl">Base URL</label>
          <input type="text" id="baseUrl" value="https://api.deepseek.com" />
        </div>
        <button class="btn-secondary" onclick="testConnection()">Test Connection</button>
      </div>

      <!-- Input Files & Output Directory -->
      <div class="card">
        <h2>Input & Output Configuration</h2>
        <div class="form-group">
          <label for="docPath">Architecture_Documentation.md Path</label>
          <input type="text" id="docPath" value="samples/Architecture_Documentation.md" />
        </div>
        <div class="form-group">
          <label for="viewsPath">Architecture_View.md Path</label>
          <input type="text" id="viewsPath" value="samples/Architecture_View.md" />
        </div>
        <div class="form-group">
          <label for="outPath">Output Directory</label>
          <input type="text" id="outPath" value="generated_project" />
        </div>
        <div class="actions">
          <button id="genBtn" class="btn-primary" onclick="startGeneration()">🚀 Generate Project</button>
          <button id="cancelBtn" class="btn-danger" disabled onclick="cancelGeneration()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Agent Todo Plan -->
    <div class="card" style="margin-bottom: 20px;">
      <h2>Agent Execution Plan</h2>
      <ul id="todoList" class="todo-list">
        <li class="todo-item todo-pending">Waiting to start generation...</li>
      </ul>
    </div>

    <!-- Live Execution Logs -->
    <div class="card">
      <h2>Live Agent Output</h2>
      <div id="consoleLog" class="console-panel">Ready. Click 'Generate Project' to start.\n</div>
    </div>
  </div>

  <script>
    let pollInterval = null;

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (data.masked_key) {
          document.getElementById('apiKey').placeholder = data.masked_key;
        }
        if (data.model) document.getElementById('modelName').value = data.model;
        if (data.base_url) document.getElementById('baseUrl').value = data.base_url;
      } catch (e) {
        console.error('Failed to load config', e);
      }
    }

    async function testConnection() {
      const apiKey = document.getElementById('apiKey').value;
      const model = document.getElementById('modelName').value;
      const baseUrl = document.getElementById('baseUrl').value;
      
      log('[Test] Validating DeepSeek credentials...');
      const res = await fetch('/api/test-connection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: apiKey, model, base_url: baseUrl })
      });
      const data = await res.json();
      if (data.success) {
        alert('DeepSeek API connection successful!');
        log('[Success] Connection verified: ' + data.message);
      } else {
        alert('Connection failed: ' + data.message);
        log('[Error] ' + data.message);
      }
    }

    async function startGeneration() {
      const payload = {
        api_key: document.getElementById('apiKey').value,
        model: document.getElementById('modelName').value,
        base_url: document.getElementById('baseUrl').value,
        doc_path: document.getElementById('docPath').value,
        views_path: document.getElementById('viewsPath').value,
        out_path: document.getElementById('outPath').value
      };

      document.getElementById('genBtn').disabled = true;
      document.getElementById('cancelBtn').disabled = false;
      document.getElementById('consoleLog').textContent = 'Starting generation process...\n';

      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      log(data.message);

      pollInterval = setInterval(pollEvents, 1000);
    }

    async function cancelGeneration() {
      await fetch('/api/cancel', { method: 'POST' });
      log('[Cancel] Requesting cancellation...');
    }

    async function pollEvents() {
      try {
        const res = await fetch('/api/events');
        const data = await res.json();
        
        if (data.events && data.events.length > 0) {
          for (const ev of data.events) {
            if (ev.type === 'plan') {
              renderTodos(ev.data.todos || []);
            } else if (ev.type === 'status') {
              log(`[STATUS] ${ev.message}`);
            } else if (ev.type === 'tool_call') {
              log(`  -> [TOOL] ${ev.message}`);
            } else if (ev.type === 'warning') {
              log(`[WARN] ${ev.message}`);
            } else if (ev.type === 'error') {
              log(`[ERROR] ${ev.message}`);
            } else if (ev.type === 'done') {
              log(`\n=== GENERATION COMPLETE ===\n${ev.message}`);
              document.getElementById('genBtn').disabled = false;
              document.getElementById('cancelBtn').disabled = true;
              clearInterval(pollInterval);
            }
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      list.innerHTML = '';
      todos.forEach(t => {
        const li = document.createElement('li');
        li.className = 'todo-item ' + (t.status === 'completed' ? 'todo-completed' : t.status === 'in_progress' ? 'todo-in-progress' : 'todo-pending');
        const mark = t.status === 'completed' ? '✓ ' : t.status === 'in_progress' ? '► ' : '○ ';
        li.textContent = mark + t.task;
        list.appendChild(li);
      });
    }

    function log(msg) {
      const box = document.getElementById('consoleLog');
      box.textContent += msg + '\n';
      box.scrollTop = box.scrollHeight;
    }

    loadConfig();
  </script>
</body>
</html>
